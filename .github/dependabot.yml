version: 2
# Every entry has a 7-day cooldown: version-update PRs skip releases less than
# a week old. Security updates aren't delayed by it.
updates:
  # Pinned SBOM generator used by the Supply Chain workflow (#137). Version
  # updates cover @cyclonedx/cdxgen only: Dependabot does not update the
  # `overrides` entries in .github/sbom/package.json (undici, body-parser, glob,
  # minimatch and @isaacs/nonrecursive-glob-match). When a cdxgen bump lands,
  # check whether its own versions are fixed and bump or drop each override by
  # hand; the exact pins would otherwise hold those packages where they are.
  - package-ecosystem: "npm"
    directory: "/.github/sbom"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci):"
    groups:
      sbom-tooling:
        patterns:
          - "*"

  # Root dev dependencies (vitest, esbuild, typescript, workers-types). The
  # package has no runtime dependencies, so these only affect tests and builds.
  # Minor and patch updates are grouped into one PR; majors come separately.
  # `increase` raises the ranges in package.json as well as the lockfile.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps):"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci):"
